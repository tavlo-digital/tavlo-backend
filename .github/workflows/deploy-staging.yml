name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Write .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.STAGING_ENV_FILE }}
        run: printenv ENV_FILE_CONTENT > .env

      - name: Deploy files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
            --exclude='.git/'
            --exclude='node_modules/'
            --exclude='vendor/'
            --exclude='public/build/'
            --exclude='public/storage/'
            --exclude='storage/'

          path: ./
          remote_path: ${{ secrets.STAGING_DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # Install PHP dependencies first (updates autoloader for new classes)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Set permissions
            chmod -R 775 storage bootstrap/cache

            php artisan key:generate --force

            # Clear stale caches before building
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear

            # Clean corrupted node_modules, then install and build frontend
            rm -rf node_modules
            npm ci
            npm run build:ssr

            # Run database migrations
            php artisan migrate --force

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart queue workers
            php artisan queue:restart

            echo "Deployment to staging complete."
