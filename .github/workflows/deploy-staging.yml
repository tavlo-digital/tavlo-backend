name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Write .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.STAGING_ENV_FILE }}
        run: printenv ENV_FILE_CONTENT > .env

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -rlvzc
            --delete
            --omit-dir-times
            --no-perms
            --no-owner
            --no-group
            --exclude='.git/'
            --exclude='node_modules/'
            --exclude='vendor/'
            --exclude='public/storage/'
            --exclude='.npm-cache/'
            --exclude='storage/'
            --exclude='cron.log'

          path: ./
          remote_path: ./applications/ynfjqwuxxs/public_html
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ./applications/ynfjqwuxxs/public_html

            # Composer may inspect the retained remote Git metadata. Trust this
            # deployment path even though the application files have another owner.
            DEPLOY_PATH="$(pwd -P)"
            git config --global --get-all safe.directory 2>/dev/null | grep -Fxq "$DEPLOY_PATH" || \
              git config --global --add safe.directory "$DEPLOY_PATH"

            # The deploy user has group write access but does not own these
            # retained runtime directories, so verify access without chmod.
            for writable_dir in storage bootstrap/cache; do
              if [ ! -w "$writable_dir" ]; then
                echo "Deployment directory is not writable by $(whoami): $writable_dir"
                ls -ld "$writable_dir"
                exit 1
              fi
            done

            # Install PHP dependencies only when Composer configuration changes.
            COMPOSER_HASH="$(sha256sum composer.json composer.lock | sha256sum | cut -d ' ' -f 1)"
            COMPOSER_HASH_FILE="storage/app/.deploy-composer-hash"
            if [ ! -f vendor/autoload.php ] || [ ! -f "$COMPOSER_HASH_FILE" ] || [ "$(cat "$COMPOSER_HASH_FILE")" != "$COMPOSER_HASH" ]; then
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress
              printf '%s' "$COMPOSER_HASH" > "$COMPOSER_HASH_FILE"
            fi

            php artisan optimize:clear

            # Run database migrations
            php artisan migrate --force

            # Rebuild caches
            php artisan optimize

            # Restart the Supervisor-managed queue workers gracefully.
            php artisan queue:restart

            echo "Deployment to staging complete."
