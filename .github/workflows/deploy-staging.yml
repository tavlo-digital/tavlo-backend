name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Write .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.STAGING_ENV_FILE }}
        run: printenv ENV_FILE_CONTENT > .env

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
            --exclude='.git/'
            --exclude='node_modules/'
            --exclude='vendor/'
            --exclude='public/storage/'
            --exclude='.npm-cache/'
            --exclude='storage/'

          path: ./
          remote_path: ${{ secrets.STAGING_DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # Install PHP dependencies only when Composer configuration changes.
            COMPOSER_HASH="$(sha256sum composer.json composer.lock | sha256sum | cut -d ' ' -f 1)"
            COMPOSER_HASH_FILE="storage/app/.deploy-composer-hash"
            if [ ! -f vendor/autoload.php ] || [ ! -f "$COMPOSER_HASH_FILE" ] || [ "$(cat "$COMPOSER_HASH_FILE")" != "$COMPOSER_HASH" ]; then
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress
              printf '%s' "$COMPOSER_HASH" > "$COMPOSER_HASH_FILE"
            fi

            # These directories retain their contents and permissions between deploys.
            chmod 775 storage bootstrap/cache

            php artisan optimize:clear

            # Run database migrations
            php artisan migrate --force

            # Rebuild caches
            php artisan optimize

            # Restart the Supervisor-managed queue workers gracefully.
            php artisan queue:restart

            # Reverb is a persistent Supervisor-managed process. This asks the
            # existing process to reload the newly deployed application code.
            php artisan reverb:restart

            echo "Deployment to staging complete."
